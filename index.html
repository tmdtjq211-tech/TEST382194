<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>실전 모의고사 • 요한계시록(7~12장)</title>
  <style>
    :root{
      --bg:#0b1020; --card:#111831; --ink:#eef3ff; --muted:#9fb0d0; --accent:#7aa2ff;
      --ok:#4ade80; --err:#ff6b6b; --line:#22305a; --ink2:#cfe0ff;
    }
    html,body{height:100%}
    body{margin:0;font-family:system-ui, "Apple SD Gothic Neo", "Noto Sans KR", Segoe UI, Roboto, sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:1000px;margin:24px auto;padding:0 16px}
    .panel{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
    
    /* ✅ 추가된 감성 배너 이미지 */
    .header-banner {
      width: 100%;
      height: 180px;
      border-radius: 12px;
      background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1000&q=80') center/cover no-repeat;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      position: relative;
    }
    .header-banner::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
      border-radius: 12px;
    }

    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .row>*{margin:4px 0}
    label{font-size:14px;color:var(--muted)}
    select,input[type="number"],textarea{
      background:#0f1430;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;
    }
    select:focus,input:focus,textarea:focus{border-color:var(--accent)}
    button{
      background:linear-gradient(180deg, #7aa2ff, #4c7cff);color:#fff;border:0;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:700;
      box-shadow:0 6px 16px rgba(74,114,255,.35)
    }
    button.ghost{background:#192247;box-shadow:none;border:1px solid #2a3a70}
    button.warn{background:linear-gradient(180deg,#ff9d7a,#ff6d4c)}
    .grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px}
    .card{background:#0f1430;border:1px solid var(--line);border-radius:16px;padding:14px}
    .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
    .qtext{font-size:15px;line-height:1.6}
    .ansrow{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .ansrow input[type="text"]{
      flex:1;min-width:180px;padding:10px 12px;border-radius:10px;border:1px solid #314378;background:#0c122b;color:var(--ink)
    }
    .badge{display:inline-block;font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid #375394;color:#cfe0ff}
    .ok{color:var(--ok)} .err{color:var(--err)} .muted{color:var(--muted)} .score{font-weight:800;font-size:18px}
    details summary{cursor:pointer;color:#cfe0ff} details.card-body>summary{list-style:none;margin:-4px 0 8px}
    details.card-body>summary::-webkit-details-marker{display:none}
    .section{padding:8px 12px;margin:4px 0 0;font-weight:700;color:#cfe0ff;border-left:4px solid #375394;opacity:.95}
    #timer{position:fixed;top:10px;right:20px;font-size:20px;color:#fff;background:#222;padding:6px 14px;border-radius:8px;z-index:9999}

  /* ----------------------------
     ① 전체 폰트 통일
  ----------------------------- */
  * {
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif !important;
    color: #1E293B;
    font-weight: 500;
  }
  body {
    background-color: #FFFFFF !important;
  }
   /* ---------------------------
     텍스트 가독성 향상
  ---------------------------- */
  body {
    color: #1E293B !important; 
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    background-color: #FFFFFF !important;
  }
  h1, h2, h3, label, select, input, textarea, button {
    color: #1E293B !important;
  }
  .muted {
    color: #475569 !important; 
  }
   /* ---------------------------
     버튼 스타일 통일
  ---------------------------- */
  button {
    border-radius: 10px;
    border: 1px solid #CBD5E1;
    font-weight: 600;
    transition: all 0.25s ease;
  }
  button:hover {
    transform: translateY(-1px);
  }
  button {
    border: 2px solid #3B82F6 !important; 
    border-radius: 12px;
    transition: all 0.2s ease;
  }
  button:hover {
    box-shadow: 0 0 6px rgba(59,130,246,0.4);
    transform: translateY(-1px);
  }
  #gen {
    background: linear-gradient(180deg, #60A5FA, #3B82F6) !important;
    color: #fff !important;
    border-color: #3B82F6 !important;
  }
  #gen:hover {
    background: linear-gradient(180deg, #93C5FD, #60A5FA) !important;
  }
  #exam {
    background: linear-gradient(180deg, #FACC15, #EAB308) !important; 
    color: #111 !important;
    border-color: #EAB308 !important;
  }
  #exam:hover {
    background: linear-gradient(180deg, #FDE047, #FACC15) !important;
    box-shadow: 0 0 10px rgba(234,179,8,0.5);
  }
  .ansrow button {
    border: none;
    padding: 8px 14px;
  }
  .ansrow button:not(.ghost):first-of-type {
    background: linear-gradient(180deg, #60A5FA, #3B82F6);
    color: #fff;
  }
  .ansrow button:not(.ghost):first-of-type:hover {
    background: linear-gradient(180deg, #93C5FD, #60A5FA);
  }
  .ansrow button.ghost {
    background: #E2E8F0;
    color: #334155;
  }
  .ansrow button.ghost:hover {
    background: #CBD5E1;
  }
   /* ----------------------------
     ② 제목 영역 (“실전 모의고사” 포함)
  ----------------------------- */
  h1 {
    font-weight: 700;
    font-size: 1.6rem;
    color: #111827 !important;
  }
  /* ----------------------------
     ③ 문항 헤더, 빈칸문제, 번호 강조 (파란색)
  ----------------------------- */
  .badge, .section, summary, .meta, .qtext {
    color: #2563EB !important; 
    font-weight: 600;
  }
  summary span.badge {
    background-color: rgba(37, 99, 235, 0.1);
    border: 1px solid #2563EB;
    color: #2563EB !important;
    border-radius: 8px;
    padding: 2px 8px;
  }
  .qtext {
    color: #2563EB !important;
    line-height: 1.6;
    font-weight: 500;
  }
  /* ----------------------------
     ④ 입력칸 / 텍스트에어리어 선명화
  ----------------------------- */
  input[type="text"], textarea {
    border: 1.8px solid #93C5FD !important;
    color: #1E293B !important;
    font-size: 15px;
    background-color: #F8FAFC;
    border-radius: 8px;
    padding: 8px 10px;
  }
  input[type="text"]:focus, textarea:focus {
    border-color: #2563EB !important;
    box-shadow: 0 0 6px rgba(37, 99, 235, 0.3);
    outline: none;
  }
  /* ----------------------------
     ⑤ 카드 타이틀 구분선 색상 개선
  ----------------------------- */
  .section {
    border-left: 4px solid #2563EB !important;
    background-color: rgba(37, 99, 235, 0.04);
    padding-left: 10px;
  }
  .ansrow button:not(.ghost):first-of-type {
    background: linear-gradient(180deg, #60A5FA, #3B82F6) !important;
    color: #fff !important;
    border: 1px solid #3B82F6 !important;
    box-shadow: 0 3px 8px rgba(59,130,246,0.3);
    transition: all 0.25s ease;
  }
  .ansrow button:not(.ghost):first-of-type:hover {
    background: linear-gradient(180deg, #93C5FD, #60A5FA) !important;
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(59,130,246,0.4);
  }
  .ansrow button.ghost {
    background: linear-gradient(180deg, #4ADE80, #22C55E) !important;
    color: #fff !important;
    border: 1px solid #16A34A !important;
    box-shadow: 0 3px 8px rgba(34,197,94,0.25);
    transition: all 0.25s ease;
  }
  .ansrow button.ghost:hover {
    background: linear-gradient(180deg, #86EFAC, #4ADE80) !important;
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(34,197,94,0.4);
  }
  .ansrow button {
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif !important;
    border-radius: 10px;
    font-weight: 600;
    padding: 8px 14px;
  }
  .foot {
    display: none !important;
    visibility: hidden !important;
  }
  @media (max-width: 640px) {
    button {
      width: 100%;
      margin-top: 6px;
    }
  }
</style>

<style id="light-override">
  :root{ --bg:#FFFFFF; --text:#1F2937; --line:#E5E7EB; --card:#FFFFFF; }
  html,body{height:100%;}
  body{
    background:var(--bg) !important;
    color:var(--text) !important;
    font-family:'Pretendard', system-ui, -apple-system, Segoe UI, Roboto,
                 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif !important;
    -webkit-text-size-adjust:100%; text-rendering:optimizeLegibility;
  }
  .panel, .card{
    background:var(--card) !important;

    color:var(--text) !important;

    .row{display:flex;flex-wrap:wrap;gap:8px}
    .row > *{flex:1 1 100%; min-width:0}

  }
</style>

<style id="dedupe-light-fix">
  :root{
    --bg:#FFFFFF; --text:#1E293B; --line:#E5E7EB; --card:#FFFFFF;
    --blue:#3B82F6; --blue-2:#60A5FA; --blue-3:#93C5FD;
    --yellow-1:#FDE047; --yellow-2:#FACC15;
    --green-1:#4ADE80; --green-2:#22C55E; --green-3:#16A34A;
  }
  html,body{height:100%}
  body{ background:var(--bg) !important; color:var(--text) !important; font-family:'Pretendard','Noto Sans KR',system-ui,-apple-system,Segoe UI,Roboto,sans-serif !important; }
  .panel,.card{ background:var(--card) !important; border:1px solid var(--line) !important; color:var(--text) !important; box-shadow:0 12px 30px rgba(17,24,39,.08) !important; border-radius:24px !important; }

  #gen{ background:linear-gradient(180deg, var(--blue-2), var(--blue)) !important; color:#fff !important; border-color:var(--blue) !important; }

  .ansrow button:not(.ghost):first-of-type:hover{ background:linear-gradient(180deg, var(--blue-3), var(--blue-2)) !important; }
  .ansrow button.ghost{ background:linear-gradient(180deg, var(--green-1), var(--green-2)) !important; color:#fff !important; border:1px solid var(--green-3) !important; box-shadow:0 3px 8px rgba(34,197,94,.25); }
  .ansrow button.ghost:hover{ background:linear-gradient(180deg, #86EFAC, var(--green-1)) !important; }

</style>

  document.addEventListener('DOMContentLoaded', ()=>{

      .find(el => el.textContent.includes('자동 출제는 BIBLE'));

  });
</script>

<style>
  button.warn{ background: linear-gradient(180deg, #f87171, #ef4444) !important; color:#fff !important; border:1px solid #dc2626 !important; box-shadow:0 3px 8px rgba(239,68,68,.3); transition:all .25s ease; }
  button.warn:hover{ background: linear-gradient(180deg, #fca5a5, #f87171) !important; transform: translateY(-1px); }
</style>

<style id="meta-header-fix">
  .section { color: #111 !important; font-weight: 700 !important; }
  .badge, .meta, details.card-body > summary { color: #111 !important; }
  .badge { background: #f3f4f6 !important; border-color: #d1d5db !important; }
  .guide-text { text-align: left; font-family: inherit; line-height: 1.4; color: #1e3a8a; background: #eff6ff; border-left: 4px solid #3b82f6; padding: 4px 8px; margin: 6px 0 10px; border-radius: 4px; }

<body>
  <div class="wrap">
    <div class="panel">
      <div class="header-banner"></div>
      
      <h1 style="margin:4px 0 12px">실전 모의고사 — 요한계시록(7~12장)</h1>

      <div class="row">
        <div>
          <label>출제 범위</label><br/>
          <select id="rangeMode">
            <option value="single">단일 장</option>
            <option value="range" selected>장 범위</option>
          </select>
        </div>

        <div id="singleBox">
          <label>장(Chapter)</label><br/>
          <select id="chapter"></select>
        </div>

        <div id="rangeBox" style="display:none">
          <div>
            <label>시작 장</label><br/>
            <select id="startCh"></select>
          </div>
          <div>
            <label>끝 장</label><br/>
            <select id="endCh"></select>
          </div>
        </div>

        <div>
          <label>문항 수</label><br/>
          <input id="count" type="number" min="1" max="200" value="25"/>
        </div>

        <div>
          <label>문항 유형</label><br/>
          <select id="modesel">
            <option value="mix" selected>혼합(빈칸+서술)</option>
            <option value="cloze">빈칸만</option>
            <option value="essay">서술만</option>
          </select>
        </div>

        <div>
          <label>난이도</label><br/>
          <select id="level">
            <option value="easy">쉬움(빈칸 2)</option>
            <option value="normal" selected>보통(빈칸 4)</option>
            <option value="hard">어려움(빈칸 6)</option>
            <option value="extreme">극악(30%)</option>
          </select>
        </div>

        <div class="row">
          <button id="gen">문제 출제</button>
          <button id="regen" class="ghost">다시 섞기</button>
          <button id="exam" class="ghost">실전 모의고사</button>
          <button id="printBtn" class="ghost">프린트</button>
        </div>
      </div>
    </div>

    <div id="board" class="grid" style="display:none"></div>

    <div id="result" class="panel" style="margin-top:16px; display:none">
      <div class="row" style="justify-content:space-between; align-items:center">
        <div id="scoreWrap">점수: <span id="score">0</span> / <span id="max">0</span></div>
      </div>
      
      <div style="text-align:center; margin-top:10px;">
        <button id="retryWrong" class="ghost" style="display:none; background:linear-gradient(180deg, var(--blue-2), var(--blue)); color:#fff; border:1px solid var(--blue); border-radius:12px; padding:10px 24px;">
          오답만 다시 풀기
        </button>
      </div>

      <button id="submitExam" class="warn" style="display:none; margin-top:8px;">제출하기</button>
      <div class="muted" style="margin-top:8px">실전 모드: 40분 제한, 제출 후 정답 공개 & 오답만 재도전</div>
      <div id="reviewPanel" style="margin-top:12px"></div>
    </div>

    <div class="muted" style="margin-top:8px">
      * 자동 출제는 BIBLE(요한계시록 7~12장)을 기반으로 합니다. <code>data.js</code>가 같은 폴더에 있어야 합니다.
    </div>
  </div>

  <script src="data.js"></script>

  <script>
  // ===== 안전가드 =====
  if(!window.BIBLE){ alert("⚠️ BIBLE이 없습니다. data.js 경로/인코딩을 확인하세요."); }

  // ===== 유틸 =====
  const $ = s=>document.querySelector(s);
  const normalize = s => (s||"").toString().trim().replace(/\s+/g,"").replace(/[^\p{L}\p{N}]+/gu,"").toLowerCase();
  const shuffle = arr => arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  const tokenizeKo = s => {
    const clean=(s||"").replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
    return clean?clean.split(" "):[];
  };

  // 다음 카드로 스크롤 + 포커스 이동
  function goToNextCard(fromCard){
    const curr = parseInt(fromCard?.dataset?.idx || "-1", 10);
    const next = document.querySelector(`.card[data-idx="${curr+1}"]`);
    if(!next) return; // 마지막 문항이면 무시

    const det = next.querySelector('details.card-body');
    if(det && !det.open) det.open = true;

    const target = next.querySelector('input[type="text"]') 
                || next.querySelector('textarea') 
                || next.querySelector('button');
    next.scrollIntoView({behavior:'smooth', block:'center'});
    setTimeout(()=> target?.focus(), 160);
  }

  // ===== DOM =====
  const board      = $('#board');
  const result     = $('#result');
  const scoreEl    = $('#score');
  const maxEl      = $('#max');
  const rangeMode  = $('#rangeMode');
  const singleBox  = $('#singleBox');
  const rangeBox   = $('#rangeBox');
  const chapterSel = $('#chapter');
  const startChSel = $('#startCh');
  const endChSel   = $('#endCh');
  const submitBtn  = $('#submitExam');
  const genBtn     = $('#gen');
  const regenBtn   = $('#regen');
  const countInput = $('#count');
  const modeSel    = $('#modesel');
  const levelSel   = $('#level');
  const retryBtn   = document.getElementById('retryWrong');
  const controls   = [rangeMode, chapterSel, startChSel, endChSel, countInput, modeSel, levelSel];
  const printBtn   = document.getElementById('printBtn');
  
  // ===== 상태 =====
  const STOP_KO = new Set(["은","는","이","가","을","를","에","에서","에게","으로","와","과","또","그리고","그러나","이는","혹은","너희","그의","그것"]);
  const MIX_CLOZE_RATIO = 0.30; 
  const MIX_ESSAY_RATIO = 0.70; 

  let CURRENT = [];              
  let SCORES  = { got:0, max:0 };
  let examRunning = false;
  let examSubmitted = false;
  let examTimer = null;

  // ===== 초기 옵션 채우기 + 기본값 (✅ 7~12장으로 수정) =====
  (function initUI(){
    const fill = (sel, from=7, to=12, def=null)=>{
      sel.innerHTML="";
      for(let i=from;i<=to;i++){
        const o=document.createElement('option');
        o.value=String(i); o.textContent=`${i}장`; sel.appendChild(o);
      }
      if(def!=null) sel.value=String(def);
    };
    // 옵션 채우기 (7~12장만 표시)
    fill(chapterSel, 7, 12, 7);   
    fill(startChSel, 7, 12, 7);
    fill(endChSel, 7, 12, 12);

    // 기본값: 장 범위 / 7~12장 / 25문항
    rangeMode.value  = 'range';
    chapterSel.value = '7';
    countInput.value = '25';

    // UI 표시 상태 동기화
    singleBox.style.display = 'none';
    rangeBox.style.display  = '';
  })();

  rangeMode.addEventListener('change', ()=>{
    const useRange = rangeMode.value==='range';
    singleBox.style.display = useRange ? 'none' : '';
    rangeBox.style.display  = useRange ? '' : 'none';
  });

  document.getElementById('gen').addEventListener('click', generate);
  document.getElementById('regen').addEventListener('click', ()=>generate(true));

  retryBtn && (retryBtn.style.display = examRunning ? 'none' : 'inline-block');

  // ===== BIBLE → 랜덤 절 묶음 로직 적용 (✅ 핵심 변경 부분) =====
  function collectVerses(chapters){
    const out=[]; if(typeof BIBLE==="undefined") return out;
    chapters.forEach(ch=>{
      const obj=BIBLE[+ch]; if(!obj) return;
      
      // 1. 해당 장의 모든 절을 숫자 순서대로 배열에 담기
      let verses = [];
      for(const [k,v] of Object.entries(obj)){
        const vno=parseInt(k,10);
        if(!Number.isNaN(vno) && (v||"").trim().length>0) verses.push({vno, v});
      }
      verses.sort((a,b)=>a.vno - b.vno);

      // 2. 1절 ~ 3절씩 무작위로 묶기
      let i = 0;
      while(i < verses.length) {
        let size = Math.floor(Math.random() * 3) + 1; // 1, 2, 또는 3 뽑기
        let chunk = verses.slice(i, i + size);
        
        if (chunk.length > 0) {
          let startV = chunk[0].vno;
          let endV = chunk[chunk.length-1].vno;
          let vLabel = startV === endV ? `${startV}` : `${startV}~${endV}`;
          let combinedText = chunk.map(x => x.v).join(" ");
          
          out.push([+ch, vLabel, combinedText]);
        }
        i += size;
      }
    });
    return out;
  }

  // ===== 빈칸 생성 =====
  function blanksByLevel(wordsLen, level){
    if(level==="easy")   return Math.min(2, Math.max(2, wordsLen>=2?2:1));
    if(level==="normal") return Math.min(4, Math.max(2, Math.floor(wordsLen*0.18) || 4));
    if(level==="hard")   return Math.min(6, Math.max(3, Math.floor(wordsLen*0.25) || 6));
    return Math.max(2, Math.round(wordsLen*0.30)); 
  }
  function makeClozeFromVerse(ch, vno, text, level){
    const tokens = tokenizeKo(text);
    const cand = [];
    tokens.forEach((w,i)=>{
      const w2=w.replace(/[^\p{L}\p{N}]+/gu,"");
      if(w2.length>=2 && !STOP_KO.has(w2)) cand.push(i);
    });
    if(cand.length===0){ for(let i=0;i<tokens.length;i++) cand.push(i); }
    const need = Math.min(blanksByLevel(tokens.length, level), cand.length);
    const picked = shuffle(cand).slice(0, need).sort((a,b)=>a-b);
    const blanks=[], shown=tokens.slice();
    picked.forEach(i=>{ blanks.push(tokens[i]); shown[i]="(   )"; });
    return { type:"cloze", ch:String(ch), ref:`계 ${ch}:${vno}`, prompt:shown.join(" "), blanks };
  }

    } else {

  // ===== 출제 =====
  function generate(isRegen=false){
    const cnt   = Math.max(1, Math.min(200, parseInt($('#count').value || "1",10)));
    const mode  = $('#modesel').value;
    const level = $('#level') ? $('#level').value : 'normal';

    const realCnt  = examRunning ? 25        : cnt;
    const realMode = examRunning ? 'mix'     : mode;
    const realLvl  = examRunning ? 'extreme' : level;

    let chapters=[];
    if(rangeMode && rangeMode.value==='range'){
      let s=parseInt(startChSel.value,10), e=parseInt(endChSel.value,10);
      if(s>e){ const t=s; s=e; e=t; }
      for(let i=s;i<=e;i++) chapters.push(String(i));
    }else{
      chapters=[chapterSel ? chapterSel.value : "7"];
    }

    const versesPool = collectVerses(chapters);
    if(!versesPool.length){ alert("선택한 범위에 구절이 없습니다."); return; }

    let wantEssay = 0, wantCloze = 0;
    if(realMode === "mix"){
      wantEssay = Math.round(realCnt * MIX_ESSAY_RATIO);
      wantCloze = realCnt - wantEssay;
      if(realCnt >= 2){
        if(wantEssay === 0){ wantEssay = 1; wantCloze = realCnt - 1; }
        if(wantCloze === 0){ wantCloze = 1; wantEssay = realCnt - 1; }
      }
    }else if(realMode === "essay"){ wantEssay = realCnt; }
     else if(realMode === "cloze"){ wantCloze = realCnt; }

    const bankEssay = [], bankCloze = [];

    const takeEssay = bankEssay.slice(0, wantEssay);
    const takeCloze = bankCloze.slice(0, wantCloze);

    let needEssay = Math.max(0, wantEssay - takeEssay.length);
    let needCloze = Math.max(0, wantCloze - takeCloze.length);

    const used = new Set();
    const autoEssay = [], autoCloze = [];
    const shuffledVerses = shuffle(versesPool.slice());

    for(const [ch, vLabel, text] of shuffledVerses){
      const key = `${ch}:${vLabel}`;
      if(needEssay > 0 && !used.has(key)){
        autoEssay.push({ type:"essay", ch:String(ch), ref:`계 ${ch}:${vLabel}`, ask:`요한계시록 ${ch}장 ${vLabel}절을 정확히 적으세요.`, model:text });
        used.add(key); needEssay--; continue;
      }
      if(needCloze > 0 && !used.has(key)){
        autoCloze.push(makeClozeFromVerse(ch, vLabel, text, realLvl));
        used.add(key); needCloze--; continue;
      }
      if(needEssay===0 && needCloze===0) break;
    }

    let pool = [];
    if (realMode === "essay") {
      const essays = [...takeEssay, ...autoEssay];
      pool = shuffle(essays);
    } else if (realMode === "cloze") {
      const clozes = [...takeCloze, ...autoCloze];
      pool = shuffle(clozes);
    } else { 
      const clozes = shuffle([...takeCloze, ...autoCloze]);
      const essays = shuffle([...takeEssay, ...autoEssay]);
      pool = [...clozes, ...essays];
    }

    if (!pool.length) { alert("출제할 문제가 없습니다. 범위를 넓혀보세요."); return; }

    CURRENT = pool.slice(0, realCnt);
    SCORES  = { got:0, max: CURRENT.length };
    renderQuestions(CURRENT);
    board.style.display='';
    result.style.display='';
    updateScore();
    if (retryBtn) retryBtn.style.display = examRunning ? 'none' : 'inline-block';
  }

  function startExamTimer(){
    const timerEl = document.createElement('div');
    timerEl.id = 'timer';
    document.body.appendChild(timerEl);
    const endAt = Date.now() + (40*60*1000);

    const tick = ()=>{
      if(!examRunning) return;
      const remainMs = Math.max(0, endAt - Date.now());
      const m = Math.floor(remainMs/60000);
      const s = Math.floor((remainMs%60000)/1000);
      timerEl.textContent = `남은 시간 ${m}:${s.toString().padStart(2,'0')}`;
      if(remainMs <= 0){
        clearInterval(examTimer);
        examRunning=false;
        finalizeExam();
      }
    };
    tick();
    examTimer = setInterval(tick, 1000);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') tick(); });
  }

  function finalizeExam(){
    const allCards = document.querySelectorAll('.card');
    let correct = 0, total = 0;
    const wrongIdx = [];

    $('#timer')?.remove();
    examRunning = false;

    if (genBtn)   genBtn.style.display   = '';
    if (regenBtn) regenBtn.style.display = '';
    controls.forEach(el=>{ if(el) el.disabled = false; });
    if (submitBtn) submitBtn.style.display = 'none';
    $('#scoreWrap').style.display='';

    allCards.forEach(card=>{
      const qtype = card.dataset.qtype;
      const idx = parseInt(card.dataset.idx, 10);
      let ok = false;

      if(qtype === 'cloze'){
        const inputs = card.querySelectorAll('input');
        const golds  = (card.dataset.blanks || "").split('|||');
        if(golds.length>0){
          total++;
          ok = [...inputs].every((inp,i)=>normalize(inp.value)===normalize(golds[i]||""));
          if(ok) correct++;
        }
      }else if(qtype === 'essay'){
        const gold = card.dataset.model || "";
        const user = (card.querySelector('textarea')?.value || "");
        total++;
        ok = (normalize(user)===normalize(gold));
        if(ok) correct++;
      }
      if(!ok && Number.isInteger(idx)) wrongIdx.push(idx);
    });

    const score = Math.round((correct/Math.max(1,total))*100);
    alert(`시험 종료!\n\n총 ${total}문항 중 ${correct}개 정답\n최종 점수: ${score}점`);

    if (!examRunning || examSubmitted) return;
    if (!confirm("제출하시겠습니까?")) return;
    if (!confirm("제출 후에는 수정할 수 없습니다. 정말 제출할까요?")) return;
    examSubmitted = true;
    submitBtn.disabled = true;
    clearInterval(examTimer);
    examRunning = false;
    finalizeExam();
  });

  board.style.display='none';
  result.style.display='none';
  updateScore();

  function retryWrong(){
  if (examRunning) {
    alert('실전 모의고사 진행 중에는 오답만 재도전이 비활성화됩니다.');
    return;
  }

  const allCards = document.querySelectorAll('.card');
  const wrongIdx = [];

  allCards.forEach(card=>{
    const qtype = card.dataset.qtype; 
    const idx   = parseInt(card.dataset.idx, 10);
    let ok = false;

    if (qtype === 'cloze') {
      const inputs = card.querySelectorAll('input');
      const golds  = (card.dataset.blanks || "").split('|||');
      if (golds.length > 0) {
        ok = [...inputs].every((inp,i)=> normalize(inp.value) === normalize(golds[i]||""));
      }
    } else if (qtype === 'essay') {
      const gold = card.dataset.model || "";
      const user = (card.querySelector('textarea')?.value || "");
      ok = (normalize(user) === normalize(gold));
    }

    if (!ok && Number.isInteger(idx)) wrongIdx.push(idx);
  });

  if (wrongIdx.length === 0) {
    alert('오답이 없습니다. 전부 맞췄어요! 🎉');
    return;
  }

  const review = wrongIdx.map(i => CURRENT[i]).filter(Boolean);
  CURRENT = review.map(q => ({ ...q })); 
  renderQuestions(CURRENT);

  board.style.display  = '';
  result.style.display = '';
  SCORES = { got: 0, max: CURRENT.length };
  updateScore();

  const wrapMsg = document.createElement('div');
  wrapMsg.className = 'panel';
  wrapMsg.style.marginTop = '12px';
  wrapMsg.innerHTML = `<strong>오답만 재도전</strong> · 총 ${CURRENT.length}문항만 다시 풀도록 구성했어요.`;
  document.querySelector('.wrap').insertBefore(wrapMsg, document.getElementById('board'));
}

document.getElementById('exam').addEventListener('click', ()=>{
  if (examRunning) return;
  if (!rangeMode || rangeMode.value !== 'range') {
    alert("실전 모의고사는 '장 범위' 모드에서만 가능합니다.\n시작/끝 장을 선택하세요.");
    return;
  }
  if (retryBtn) retryBtn.style.display = 'none';

  if (countInput) countInput.value = '25';     
  if (modeSel)    modeSel.value    = 'mix';    
  if (levelSel)   levelSel.value   = 'extreme';

  examRunning = true;
  generate(); 

  alert('실전 모의고사를 시작합니다!');
});
  </script>
</body>
