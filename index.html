<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>실전 모의고사 • 요한계시록(7~12장)</title>
  
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.css">

  <style>
    /* =========================================
       ✨ 완전 새롭게 설계된 모던 디자인 시스템 ✨
       ========================================= */
    :root {
      --bg-color: #F1F5F9;          /* 부드러운 앱 배경색 */
      --surface: #FFFFFF;           /* 카드/패널 배경색 */
      --text-main: #0F172A;         /* 진한 메인 텍스트 */
      --text-muted: #64748B;        /* 보조 텍스트 */
      --primary: #4F46E5;           /* 메인 브랜드 컬러 (세련된 인디고) */
      --primary-hover: #4338CA;
      --secondary: #F8FAFC;         /* 서브 요소 배경 */
      --border: #E2E8F0;            /* 은은한 테두리 */
      --input-bg: #F8FAFC;
      --success: #10B981;
      --danger: #EF4444;
      --warn: #F59E0B;
      --radius-lg: 20px;            /* 둥글고 부드러운 모서리 */
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    
    body {
      font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    .wrap {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 20px;
    }

    /* --- 감성 히어로 배너 --- */
    .hero-banner {
      position: relative;
      width: 100%;
      height: 220px;
      border-radius: var(--radius-lg);
      background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      margin-bottom: 24px;
      display: flex;
      align-items: flex-end;
      padding: 30px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .hero-banner::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to top, rgba(15,23,42,0.85) 0%, rgba(15,23,42,0.2) 100%);
    }
    .hero-banner h1 {
      position: relative;
      color: #ffffff;
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* --- 패널 및 카드 기본 --- */
    .panel, .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(255,255,255,0.8); /* 입체감 */
      margin-bottom: 20px;
    }

    .card {
      padding: 24px;
      border: 1px solid var(--border);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    /* --- 폼 & 컨트롤 영역 --- */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }
    .control-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    select, input[type="number"], input[type="text"], textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
    }

    /* --- 세련된 버튼 스타일 --- */
    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
    }
    button:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(79, 70, 229, 0.3);
    }
    button:active { transform: translateY(0); }

    /* 서브 버튼 (회색) */
    button.ghost {
      background: #FFFFFF;
      color: var(--text-main);
      border: 1px solid #CBD5E1;
      box-shadow: var(--shadow-sm);
    }
    button.ghost:hover {
      background: #F8FAFC;
      border-color: #94A3B8;
      box-shadow: var(--shadow-md);
    }

    /* 실전 모의고사 전용 버튼 (황금색) */
    button#exam {
      background: linear-gradient(135deg, #F59E0B, #D97706);
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
    }
    button#exam:hover {
      background: linear-gradient(135deg, #FCD34D, #F59E0B);
      box-shadow: 0 6px 15px rgba(245, 158, 11, 0.4);
    }

    /* 위험/정답보기 버튼 (빨간색) */
    button.warn { background: var(--danger); box-shadow: 0 4px 6px rgba(239, 68, 68, 0.2); }
    button.warn:hover { background: #DC2626; box-shadow: 0 6px 12px rgba(239, 68, 68, 0.3); }

    /* --- 문제 카드 내부 디자인 --- */
    summary { cursor: pointer; list-style: none; outline: none; }
    summary::-webkit-details-marker { display: none; }
    .badge {
      display: inline-block;
      background: #EEF2FF;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      margin-right: 8px;
      vertical-align: middle;
    }
    .meta-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      display: inline-block;
      vertical-align: middle;
    }
    
    .guide-text {
      background: var(--secondary);
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 13px;
      color: var(--text-muted);
      margin: 16px 0;
    }
    .guide-text strong { color: var(--text-main); font-weight: 700; }

    .qtext {
      font-size: 17px;
      line-height: 1.7;
      color: var(--text-main);
      font-weight: 500;
      margin: 16px 0;
    }

    /* --- 답변 영역 --- */
    .ansrow {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 20px;
    }
    .ansrow input[type="text"] {
      flex: 1;
      min-width: 150px;
    }
    .ansrow button { padding: 10px 16px; font-size: 14px; }

    /* 채점 결과 텍스트 */
    .judge, .model {
      margin-top: 16px;
      padding: 16px;
      border-radius: var(--radius-md);
      background: #F8FAFC;
      border: 1px solid var(--border);
      font-size: 15px;
    }
    .err { color: var(--danger); font-weight: 700; text-decoration: underline; text-decoration-color: rgba(239,68,68,0.3); text-underline-offset: 4px; }

    /* --- 기타 UI --- */
    .section-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      margin: 32px 0 16px;
      display: flex;
      align-items: center;
    }
    .section-title::before {
      content: ''; display: inline-block; width: 6px; height: 20px; background: var(--primary); border-radius: 4px; margin-right: 10px;
    }
    
    #timer {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      color: white;
      font-weight: 700;
      font-size: 18px;
      padding: 10px 20px;
      border-radius: 100px;
      z-index: 9999;
      box-shadow: var(--shadow-lg);
    }
    
    .score-wrap { font-size: 18px; font-weight: 800; color: var(--primary); }

    /* 모바일 최적화 */
    @media (max-width: 640px) {
      .hero-banner { height: 160px; padding: 20px; }
      .hero-banner h1 { font-size: 22px; }
      .panel, .card { padding: 20px; }
      .actions-row { flex-direction: column; }
      .actions-row button { width: 100%; }
      .ansrow input[type="text"] { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    
    <div class="hero-banner">
      <h1>실전 모의고사 — 요한계시록(7~12장)</h1>
    </div>

    <div class="panel">
      <div class="controls-grid">
        <div class="control-group">
          <label>출제 범위</label>
          <select id="rangeMode">
            <option value="single">단일 장</option>
            <option value="range" selected>장 범위</option>
          </select>
        </div>

        <div class="control-group" id="singleBox" style="display:none">
          <label>장(Chapter)</label>
          <select id="chapter"></select>
        </div>

        <div class="control-group" id="rangeBox_start">
          <label>시작 장</label>
          <select id="startCh"></select>
        </div>
        <div class="control-group" id="rangeBox_end">
          <label>끝 장</label>
          <select id="endCh"></select>
        </div>

        <div class="control-group">
          <label>문항 수</label>
          <input id="count" type="number" min="1" max="200" value="25"/>
        </div>

        <div class="control-group">
          <label>문항 유형</label>
          <select id="modesel">
            <option value="mix" selected>혼합(빈칸+서술)</option>
            <option value="cloze">빈칸만</option>
            <option value="essay">서술만</option>
          </select>
        </div>

        <div class="control-group">
          <label>난이도</label>
          <select id="level">
            <option value="easy">쉬움 (빈칸 조금)</option>
            <option value="normal" selected>보통 (적절히)</option>
            <option value="hard">어려움 (빈칸 많음)</option>
            <option value="extreme">극악 (하드코어)</option>
          </select>
        </div>
      </div>

      <div class="actions-row">
        <button id="gen">📝 문제 출제</button>
        <button id="regen" class="ghost">🔄 다시 섞기</button>
        <button id="printBtn" class="ghost">🖨️ 프린트</button>
        <button id="exam">⏱️ 실전 모의고사 시작</button>
      </div>
    </div>

    <div id="board" style="display:none"></div>

    <div id="result" class="panel" style="margin-top:24px; display:none">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
        <div class="score-wrap" id="scoreWrap">
          🎯 내 점수: <span id="score" style="font-size:24px;">0</span> / <span id="max">0</span>
        </div>
        <div>
          <button id="retryWrong" class="ghost" style="display:none; background:var(--primary); color:white; border:none;">
            오답만 다시 풀기
          </button>
          <button id="submitExam" class="warn" style="display:none;">최종 제출하기</button>
        </div>
      </div>
      <div style="color:var(--text-muted); font-size:13px; margin-top:12px;" id="examGuideText">
        * 실전 모드: 40분 제한, 제출 후 정답 공개 & 오답 복습 가능
      </div>
    </div>

    <div style="text-align:center; color:var(--text-muted); font-size:13px; margin-top:32px;">
      BIBLE (요한계시록 7~12장) 엔진 기반 
    </div>
  </div>

  <script src="data.js"></script>

  <script>
  if(!window.BIBLE){ alert("⚠️ BIBLE 데이터가 없습니다. data.js 파일이 같은 폴더에 있는지 확인하세요."); }

  const $ = s=>document.querySelector(s);
  const normalize = s => (s||"").toString().trim().replace(/\s+/g,"").replace(/[^\p{L}\p{N}]+/gu,"").toLowerCase();
  const shuffle = arr => arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  const tokenizeKo = s => {
    const clean=(s||"").replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
    return clean?clean.split(" "):[];
  };

  function goToNextCard(fromCard){
    const curr = parseInt(fromCard?.dataset?.idx || "-1", 10);
    const next = document.querySelector(`.card[data-idx="${curr+1}"]`);
    if(!next) return; 
    const det = next.querySelector('details.card-body');
    if(det && !det.open) det.open = true;
    const target = next.querySelector('input[type="text"]') || next.querySelector('textarea') || next.querySelector('button');
    next.scrollIntoView({behavior:'smooth', block:'center'});
    setTimeout(()=> target?.focus(), 160);
  }

  const board      = $('#board');
  const result     = $('#result');
  const scoreEl    = $('#score');
  const maxEl      = $('#max');
  const rangeMode  = $('#rangeMode');
  const singleBox  = $('#singleBox');
  const startChBox = $('#rangeBox_start');
  const endChBox   = $('#rangeBox_end');
  const chapterSel = $('#chapter');
  const startChSel = $('#startCh');
  const endChSel   = $('#endCh');
  const submitBtn  = $('#submitExam');
  const genBtn     = $('#gen');
  const regenBtn   = $('#regen');
  const countInput = $('#count');
  const modeSel    = $('#modesel');
  const levelSel   = $('#level');
  const retryBtn   = $('#retryWrong');
  const controls   = [rangeMode, chapterSel, startChSel, endChSel, countInput, modeSel, levelSel];
  
  const STOP_KO = new Set(["은","는","이","가","을","를","에","에서","에게","으로","와","과","또","그리고","그러나","이는","혹은","너희","그의","그것"]);
  const MIX_CLOZE_RATIO = 0.30; 
  const MIX_ESSAY_RATIO = 0.70; 

  let CURRENT = [];              
  let SCORES  = { got:0, max:0 };
  let examRunning = false;
  let examSubmitted = false;
  let examTimer = null;

  (function initUI(){
    const fill = (sel, from=7, to=12, def=null)=>{
      sel.innerHTML="";
      for(let i=from;i<=to;i++){
        const o=document.createElement('option');
        o.value=String(i); o.textContent=`${i}장`; sel.appendChild(o);
      }
      if(def!=null) sel.value=String(def);
    };
    fill(chapterSel, 7, 12, 7);   
    fill(startChSel, 7, 12, 7);
    fill(endChSel, 7, 12, 12);

    rangeMode.value  = 'range';
    chapterSel.value = '7';
    countInput.value = '25';
  })();

  rangeMode.addEventListener('change', ()=>{
    const useRange = rangeMode.value==='range';
    singleBox.style.display = useRange ? 'none' : 'block';
    startChBox.style.display  = useRange ? 'block' : 'none';
    endChBox.style.display  = useRange ? 'block' : 'none';
  });

  // ===== BIBLE → 랜덤 절 묶음 로직 =====
  function collectVerses(chapters){
    const out=[]; if(typeof BIBLE==="undefined") return out;
    chapters.forEach(ch=>{
      const obj=BIBLE[+ch]; if(!obj) return;
      let verses = [];
      for(const [k,v] of Object.entries(obj)){
        const vno=parseInt(k,10);
        if(!Number.isNaN(vno) && (v||"").trim().length>0) verses.push({vno, v});
      }
      verses.sort((a,b)=>a.vno - b.vno);

      let i = 0;
      while(i < verses.length) {
        let size = Math.floor(Math.random() * 3) + 1; 
        let chunk = verses.slice(i, i + size);
        if (chunk.length > 0) {
          let startV = chunk[0].vno;
          let endV = chunk[chunk.length-1].vno;
          let vLabel = startV === endV ? `${startV}` : `${startV}~${endV}`;
          let combinedText = chunk.map(x => x.v).join(" ");
          out.push([+ch, vLabel, combinedText]);
        }
        i += size;
      }
    });
    return out;
  }

  function blanksByLevel(wordsLen, level){
    if(level==="easy")   return Math.min(2, Math.max(2, wordsLen>=2?2:1));
    if(level==="normal") return Math.min(4, Math.max(2, Math.floor(wordsLen*0.18) || 4));
    if(level==="hard")   return Math.min(6, Math.max(3, Math.floor(wordsLen*0.25) || 6));
    return Math.max(2, Math.round(wordsLen*0.30)); 
  }
  
  function makeClozeFromVerse(ch, vno, text, level){
    const tokens = tokenizeKo(text);
    const cand = [];
    tokens.forEach((w,i)=>{
      const w2=w.replace(/[^\p{L}\p{N}]+/gu,"");
      if(w2.length>=2 && !STOP_KO.has(w2)) cand.push(i);
    });
    if(cand.length===0){ for(let i=0;i<tokens.length;i++) cand.push(i); }
    const need = Math.min(blanksByLevel(tokens.length, level), cand.length);
    const picked = shuffle(cand).slice(0, need).sort((a,b)=>a-b);
    const blanks=[], shown=tokens.slice();
    picked.forEach(i=>{ blanks.push(tokens[i]); shown[i]="(   )"; });
    return { type:"cloze", ch:String(ch), ref:`계 ${ch}:${vno}`, prompt:shown.join(" "), blanks };
  }

  function updateScore(){ scoreEl.textContent=String(SCORES.got); maxEl.textContent=String(SCORES.max); }
  
  function renderQuestions(list){
    board.innerHTML = '';
    const isMix = (modeSel.value === 'mix');
    const clozes = list.filter(q => q.type === 'cloze');
    const essays = list.filter(q => q.type === 'essay');

    const addSectionHeader = (title) => {
      const h = document.createElement('div'); h.className = 'section-title'; h.textContent = title; board.appendChild(h);
    };

    const renderBlock = (arr, offset=0) => {
      arr.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.idx = String(offset + idx);

        const details = document.createElement('details');
        details.className = 'card-body';
        details.open = true;

        const metaLine = `${q.type==="cloze"?"빈칸":"서술"} · ${q.ref || '-'} · ${q.ch || '-'}장`;
        const summary = document.createElement('summary');
        summary.innerHTML = `<span class="badge">${q.type==="cloze"?"빈칸":"서술"}</span><span class="meta-title">문항 ${offset+idx+1} <span style="color:var(--text-muted);font-weight:500;font-size:14px;">(${metaLine})</span></span>`;
        details.appendChild(summary);

        const guide = document.createElement('div');
        guide.className = 'guide-text';
        guide.innerHTML = (q.type === "cloze")
          ? '💡 <strong>[작성 팁]</strong> 탭(Tab)키나 스페이스를 누르면 다음 빈칸으로 쏙 넘어갑니다.'
          : '💡 <strong>[작성 팁]</strong> 정확한 구절을 한 번에 입력해 보세요.';
        details.appendChild(guide);

        const qt = document.createElement('div');
        qt.className = 'qtext';
        qt.textContent = (q.type==="cloze") ? q.prompt : (q.ask || '구절을 정확히 적으세요.');
        details.appendChild(qt);

        const ans = document.createElement('div');
        ans.className = 'ansrow';

        if (q.type === 'cloze') {
          const inputs = (q.blanks || []).map((_, i) => {
            const inp = document.createElement('input');
            inp.type = 'text'; inp.placeholder = `빈칸 ${i+1}`; inp.dataset.idx = i;
            return inp;
          });
          inputs.forEach(inp => ans.appendChild(inp));
          
          inputs.forEach((inp, i) => {
            let spaceDown = false;
            let composing = false;
            inp.addEventListener('compositionstart', () => { composing = true; });
            inp.addEventListener('compositionend',   () => { composing = false; });
            inp.addEventListener('keydown', (e) => {
              if ((e.code === 'Space' || e.key === ' ') && !e.isComposing && !composing) {
                if (e.repeat) { e.preventDefault(); return; }
                spaceDown = true; e.preventDefault();
              }
            });
            inp.addEventListener('keyup', (e) => {
              if ((e.code === 'Space' || e.key === ' ') && spaceDown && !composing) {
                spaceDown = false; e.preventDefault();
                inp.value = (inp.value || '').replace(/\s+$/, '');
                const next = inputs[i+1] || ans.querySelector('button'); 
                if (next) setTimeout(() => next.focus(), 0); 
              }
            });
          });

          const gradeCloze = () => {
            let ok = 0;
            inputs.forEach((inp, i) => {
              const user = normalize(inp.value), gold = normalize(q.blanks[i]);
              inp.style.borderColor = (user === gold) ? "var(--success)" : "var(--danger)";
              if (user === gold) ok++;
            });
            const old = card.querySelector('.judge'); if (old) old.remove();
            const show = document.createElement('div'); show.className = 'judge';
            const pairs = q.blanks.map((a, i) => {
              const u = normalize(inputs[i].value || ""), g = normalize(a);
              return u===g ? `<strong style="color:var(--success)">${a}</strong>` : `<span class="err">${a}</span>`;
            }).join(" / ");
            show.innerHTML = `<div style="font-weight:800; color:${ok===q.blanks.length?'var(--success)':'var(--danger)'}">${ok===q.blanks.length?'✅ 정답입니다!':'❌ 다시 확인해보세요!'}</div>
                              <div style="margin-top:8px; color:var(--text-muted)"><strong>올바른 답:</strong> ${pairs}</div>`;
            details.appendChild(show);

            if (card.dataset.scored !== "1") {
              if (ok === q.blanks.length) SCORES.got += 1;
              card.dataset.scored = "1"; updateScore();
            }
            if (ok === q.blanks.length) setTimeout(()=>goToNextCard(card), 120);
          };

          const btn = document.createElement('button'); btn.textContent = '채점하기'; btn.onclick = gradeCloze; ans.appendChild(btn);
          const btnClear = document.createElement('button'); btnClear.textContent = '지우기'; btnClear.className = 'ghost';
          btnClear.onclick = () => {
            inputs.forEach(inp => { inp.value = ""; inp.style.borderColor = "var(--border)"; });
            const old = card.querySelector('.judge'); if (old) old.remove();
            if (card.dataset.scored === "1") { card.dataset.scored = "0"; updateScore(); }
          };
          ans.appendChild(btnClear);

          let enterCount = 0, enterTimer = null;
          inputs.forEach(inp => {
            inp.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') {
                e.preventDefault(); enterCount++; clearTimeout(enterTimer);
                enterTimer = setTimeout(() => {
                  if (enterCount === 1) gradeCloze(); else btnClear.click();
                  enterCount = 0;
                }, 300);
              }
            });
          });
          card.dataset.qtype = 'cloze'; card.dataset.blanks = (q.blanks || []).join('|||');

        } else {
          const tx = document.createElement('textarea'); tx.rows = 4; tx.placeholder = "이곳에 말씀을 작성해주세요."; ans.appendChild(tx);
          card.dataset.qtype = 'essay'; card.dataset.model = (q.model || "");

          const judgeEssay = () => {
            const old = card.querySelector('.model'); if (old) old.remove();
            const judge = document.createElement('div'); judge.className = 'model';
            const gold = (q.model || "").trim(); const user = (tx.value || "").trim();
            const ok = normalize(user) === normalize(gold);

            let diffHtml = gold;
            if (!ok) {
              const gWords = gold.split(/\s+/); const uWords = user.split(/\s+/);
              diffHtml = gWords.map((w, i) => normalize(w) === normalize(uWords[i] || "") ? w : `<span class="err">${w}</span>`).join(" ");
            }
            judge.innerHTML = `<div style="font-weight:800; color:${ok?'var(--success)':'var(--danger)'}">${ok?'✅ 완벽합니다!':'❌ 오답입니다!'}</div>
                               ${!ok ? `<div style="margin-top:8px; color:var(--text-muted)"><strong>비교 확인:</strong> ${diffHtml}</div>` : ''}`;
            details.appendChild(judge);

            if (card.dataset.scored !== "1") { if (ok) SCORES.got += 1; card.dataset.scored = "1"; updateScore(); }
            if (ok) setTimeout(()=>goToNextCard(card), 120);
          };

          const btnJudge = document.createElement('button'); btnJudge.textContent = '채점하기'; btnJudge.onclick = judgeEssay; ans.appendChild(btnJudge);
          const btnShow = document.createElement('button'); btnShow.textContent = '정답 보기'; btnShow.className = 'warn';
          btnShow.onclick = () => {
            const old = card.querySelector('.model'); if (old) old.remove();
            const model = document.createElement('div'); model.className = 'model';
            model.innerHTML = `<strong style="color:var(--text-main)">[모범 답안]</strong><div style="margin-top:6px">${q.model}</div>`;
            details.appendChild(model);
          };
          ans.appendChild(btnShow);

          const btnClear = document.createElement('button'); btnClear.textContent = '지우기'; btnClear.className = 'ghost';
          btnClear.onclick = () => {
            tx.value = ""; const old = card.querySelector('.model'); if (old) old.remove();
            if (card.dataset.scored === "1") { card.dataset.scored = "0"; updateScore(); }
          };
          ans.appendChild(btnClear);
        }

        details.appendChild(ans); card.appendChild(details); board.appendChild(card);
      });
    };

    if(isMix){
      if(clozes.length){ addSectionHeader('🧩 빈칸 채우기'); renderBlock(clozes, 0); }
      if(essays.length){ addSectionHeader('✍️ 전체 서술하기'); renderBlock(essays, clozes.length); }
    }else{
      renderBlock(list, 0);
    }
  }

  function generate(isRegen=false){
    const cnt   = Math.max(1, Math.min(200, parseInt($('#count').value || "1",10)));
    const mode  = $('#modesel').value;
    const level = $('#level') ? $('#level').value : 'normal';
    const realCnt  = examRunning ? 25 : cnt;
    const realMode = examRunning ? 'mix' : mode;
    const realLvl  = examRunning ? 'extreme' : level;

    let chapters=[];
    if(rangeMode.value==='range'){
      let s=parseInt(startChSel.value,10), e=parseInt(endChSel.value,10);
      if(s>e){ const t=s; s=e; e=t; }
      for(let i=s;i<=e;i++) chapters.push(String(i));
    }else{
      chapters=[chapterSel.value];
    }

    const versesPool = collectVerses(chapters);
    if(!versesPool.length){ alert("선택한 범위에 구절이 없습니다."); return; }

    let wantEssay = 0, wantCloze = 0;
    if(realMode === "mix"){
      wantEssay = Math.round(realCnt * MIX_ESSAY_RATIO);
      wantCloze = realCnt - wantEssay;
      if(realCnt >= 2){
        if(wantEssay === 0){ wantEssay = 1; wantCloze = realCnt - 1; }
        if(wantCloze === 0){ wantCloze = 1; wantEssay = realCnt - 1; }
      }
    }else if(realMode === "essay"){ wantEssay = realCnt; }
     else if(realMode === "cloze"){ wantCloze = realCnt; }

    let needEssay = wantEssay, needCloze = wantCloze;
    const used = new Set(), autoEssay = [], autoCloze = [];
    const shuffledVerses = shuffle(versesPool.slice());

    for(const [ch, vLabel, text] of shuffledVerses){
      const key = `${ch}:${vLabel}`;
      if(needEssay > 0 && !used.has(key)){
        autoEssay.push({ type:"essay", ch:String(ch), ref:`계 ${ch}:${vLabel}`, ask:`요한계시록 ${ch}장 ${vLabel}절을 정확히 적으세요.`, model:text });
        used.add(key); needEssay--; continue;
      }
      if(needCloze > 0 && !used.has(key)){
        autoCloze.push(makeClozeFromVerse(ch, vLabel, text, realLvl));
        used.add(key); needCloze--; continue;
      }
      if(needEssay===0 && needCloze===0) break;
    }

    let pool = [];
    if (realMode === "essay") pool = shuffle(autoEssay);
    else if (realMode === "cloze") pool = shuffle(autoCloze);
    else pool = [...shuffle(autoCloze), ...shuffle(autoEssay)];

    if (!pool.length) { alert("출제할 문제가 없습니다."); return; }

    CURRENT = pool.slice(0, realCnt);
    SCORES  = { got:0, max: CURRENT.length };
    renderQuestions(CURRENT);
    board.style.display='block';
    result.style.display='block';
    updateScore();
    if (retryBtn) retryBtn.style.display = examRunning ? 'none' : 'inline-block';
  }

  function startExamTimer(){
    const timerEl = document.createElement('div'); timerEl.id = 'timer'; document.body.appendChild(timerEl);
    const endAt = Date.now() + (40*60*1000);
    const tick = ()=>{
      if(!examRunning) return;
      const remainMs = Math.max(0, endAt - Date.now());
      const m = Math.floor(remainMs/60000); const s = Math.floor((remainMs%60000)/1000);
      timerEl.textContent = `⏳ 남은 시간 ${m}:${s.toString().padStart(2,'0')}`;
      if(remainMs <= 0){ clearInterval(examTimer); examRunning=false; finalizeExam(); }
    };
    tick(); examTimer = setInterval(tick, 1000);
  }

  function finalizeExam(){
    const allCards = document.querySelectorAll('.card');
    let correct = 0, total = 0; const wrongIdx = [];
    $('#timer')?.remove(); examRunning = false;

    controls.forEach(el=>{ if(el) el.disabled = false; });
    genBtn.style.display=''; regenBtn.style.display=''; submitBtn.style.display='none';
    $('#scoreWrap').style.display='block'; $('#examGuideText').style.display='block';

    allCards.forEach(card=>{
      const qtype = card.dataset.qtype; const idx = parseInt(card.dataset.idx, 10);
      let ok = false;
      if(qtype === 'cloze'){
        const inputs = card.querySelectorAll('input'); const golds = (card.dataset.blanks || "").split('|||');
        if(golds.length>0){ total++; ok = [...inputs].every((inp,i)=>normalize(inp.value)===normalize(golds[i]||"")); if(ok) correct++; }
      }else if(qtype === 'essay'){
        const gold = card.dataset.model || ""; const user = (card.querySelector('textarea')?.value || "");
        total++; ok = (normalize(user)===normalize(gold)); if(ok) correct++;
      }
      if(!ok && Number.isInteger(idx)) wrongIdx.push(idx);
    });

    const score = Math.round((correct/Math.max(1,total))*100);
    alert(`🎉 시험 종료!\n\n총 ${total}문항 중 ${correct}개 정답\n최종 점수: ${score}점`);

    if(wrongIdx.length){
      CURRENT = wrongIdx.map(i => CURRENT[i]).filter(Boolean);
      renderQuestions(CURRENT);
      SCORES = { got:0, max: CURRENT.length }; updateScore();
      retryBtn.style.display = 'inline-block';
      const msg = document.createElement('div'); msg.className = 'guide-text'; msg.style.margin="20px 0";
      msg.innerHTML = `<strong>💡 오답 복습 모드</strong>틀린 문제 ${CURRENT.length}개만 다시 모았습니다. 완벽하게 외워보세요!`;
      board.insertBefore(msg, board.firstChild);
    } else {
      retryBtn.style.display = 'none';
      alert('전부 맞추셨습니다! 대단합니다.');
    }
  }

  $('#gen').addEventListener('click', () => generate(false));
  $('#regen').addEventListener('click', () => generate(true));
  $('#printBtn').addEventListener('click', () => alert('프린트 기능은 브라우저 인쇄(Ctrl+P)를 활용해주세요.'));
  
  $('#exam').addEventListener('click', ()=>{
    if (examRunning) return;
    if (rangeMode.value !== 'range') { alert("실전 모의고사는 '장 범위' 모드에서만 가능합니다."); return; }
    
    countInput.value = '25'; modeSel.value = 'mix'; levelSel.value = 'extreme';
    controls.forEach(el=>{ if(el) el.disabled = true; });
    genBtn.style.display='none'; regenBtn.style.display='none'; retryBtn.style.display='none';
    submitBtn.style.display = 'inline-flex';
    $('#scoreWrap').style.display='none'; $('#examGuideText').style.display='none';
    
    examRunning = true; examSubmitted = false;
    generate(); startExamTimer();
    alert('🔥 실전 모의고사를 시작합니다. (제한시간 40분)');
  });

  submitBtn.addEventListener('click', ()=>{
    if (!examRunning || examSubmitted) return;
    if (!confirm("답안을 최종 제출하시겠습니까? 제출 후 수정 불가!")) return;
    examSubmitted = true; submitBtn.disabled = true;
    clearInterval(examTimer); finalizeExam();
  });

  retryBtn.addEventListener('click', ()=>{
    if (examRunning) return alert('시험 중에는 오답 재도전이 불가능합니다.');
    const allCards = document.querySelectorAll('.card'); const wrongIdx = [];
    allCards.forEach(card=>{
      const qtype = card.dataset.qtype; const idx = parseInt(card.dataset.idx, 10); let ok = false;
      if (qtype === 'cloze') {
        const inputs = card.querySelectorAll('input'); const golds = (card.dataset.blanks || "").split('|||');
        if (golds.length > 0) ok = [...inputs].every((inp,i)=> normalize(inp.value) === normalize(golds[i]||""));
      } else {
        const gold = card.dataset.model || ""; const user = (card.querySelector('textarea')?.value || "");
        ok = (normalize(user) === normalize(gold));
      }
      if (!ok && Number.isInteger(idx)) wrongIdx.push(idx);
    });
    if (wrongIdx.length === 0) return alert('오답이 없습니다! 🎉');
    
    CURRENT = wrongIdx.map(i => CURRENT[i]).filter(Boolean).map(q => ({ ...q }));
    renderQuestions(CURRENT);
    SCORES = { got: 0, max: CURRENT.length }; updateScore();
    const msg = document.createElement('div'); msg.className = 'guide-text'; msg.style.margin="20px 0";
    msg.innerHTML = `<strong>💡 오답만 재도전</strong>남은 ${CURRENT.length}문항을 다시 풉니다. 파이팅!`;
    board.insertBefore(msg, board.firstChild);
  });
  </script>
</body>
